<header class="site-header">
  <div class="container header-inner">
    <a class="header-logo" routerLink="/" aria-label="Comu — página inicial">
      <img ngSrc="/images/logo-comu-black.svg" alt="Comu" width="112" height="26" priority />
    </a>

    <nav class="header-nav" aria-label="Navegação principal">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          routerLinkActive="is-active"
          >{{ item.label }}</a
        >
      }
    </nav>

    <div class="header-cta">
      @if (isNaMidiaPage) {
        <a class="comu-btn comu-btn--dark" routerLink="/">Conhecer a Comu</a>
      } @else {
        <a class="comu-btn comu-btn--dark" routerLink="/" fragment="aplicativo"
          >Entrar na comunidade</a
        >
      }
    </div>
  </div>
</header>

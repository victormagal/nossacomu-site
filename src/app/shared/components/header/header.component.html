<header class="site-header">
  <div class="container header-inner">
    <a class="header-logo" routerLink="/" aria-label="Comu — página inicial">
      <img ngSrc="/images/logo-comu-black.svg" alt="Comu" width="112" height="26" priority />
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="primary-navigation"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ isMenuOpen() ? 'Fechar menu' : 'Abrir menu' }}</span>
      <span class="menu-toggle-icon" aria-hidden="true"></span>
    </button>

    <nav
      class="header-nav"
      id="primary-navigation"
      aria-label="Navegação principal"
      [class.is-open]="isMenuOpen()"
    >
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        routerLinkActive="is-active"
        (click)="closeMenu()"
        >A Comu</a
      >
      <a
        routerLink="/solucoes-para-criadores"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        routerLinkActive="is-active"
        (click)="closeMenu()"
        >Para criadores</a
      >

      <div class="nav-group" [class.is-open]="isBrandsOpen()">
        <button
          class="nav-trigger"
          type="button"
          [class.is-active]="isBrandsActive()"
          [attr.aria-expanded]="isBrandsOpen()"
          aria-controls="brands-submenu"
          (click)="toggleBrands()"
        >
          Para marcas
        </button>
        <div class="submenu" id="brands-submenu">
          <a
            routerLink="/solucoes-para-marcas"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            routerLinkActive="is-active"
            (click)="closeMenu()"
            >Saiba mais</a
          >
          <a
            routerLink="/solucoes-para-marcas/criar-campanha"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            routerLinkActive="is-active"
            (click)="closeMenu()"
            >Criar campanha</a
          >
        </div>
      </div>

      <a
        routerLink="/eventos"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        routerLinkActive="is-active"
        (click)="closeMenu()"
        >Eventos</a
      >
      <a
        routerLink="/carreiras"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        routerLinkActive="is-active"
        (click)="closeMenu()"
        >Carreiras</a
      >

      <div class="header-cta header-cta--mobile">
        <a
          class="comu-btn comu-btn--dark"
          routerLink="/"
          fragment="aplicativo"
          (click)="closeMenu()"
          >Entrar na comunidade</a
        >
      </div>
    </nav>

    <div class="header-cta">
      <a class="comu-btn comu-btn--dark" routerLink="/" fragment="aplicativo"
        >Entrar na comunidade</a
      >
    </div>
  </div>
</header>

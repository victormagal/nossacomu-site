<section class="section">
  <div class="container">
    <div class="header-pill">
      <div class="header-logo">
        <a href="/" aria-label="Comu - página inicial">
          <img ngSrc="/images/logo-comu-black.svg" alt="Comu" height="24" width="106" />
        </a>
      </div>
      <div class="header-menu">
        <button
          [attr.aria-expanded]="menuOpen()"
          aria-controls="primary-navigation"
          aria-label="Abrir ou fechar menu"
          class="menu-btn"
          type="button"
          (click)="toggleMenu()"
        >
          <i
            [class.fa-bars]="!menuOpen()"
            [class.fa-xmark]="menuOpen()"
            aria-hidden="true"
            class="fa-solid"
          ></i>
        </button>
        <nav
          [class.is-open]="menuOpen()"
          aria-label="Menu principal"
          class="primary-navigation"
          id="primary-navigation"
        >
          <ul role="list">
            <li><a href="/" (click)="closeMenu()">A Comu</a></li>
            <li><a href="/solucoes-para-criadores" (click)="closeMenu()">Para creators</a></li>
            <li><a href="/solucoes-para-marcas" (click)="closeMenu()">Para marcas</a></li>
            <li><a href="/eventos" (click)="closeMenu()">Eventos</a></li>
            <li>
              <a
                class="whatsapp-link"
                href="https://wa.me/5561993745254"
                target="_blank"
                rel="noopener noreferrer"
                (click)="closeMenu()"
                >Entrar pelo WhatsApp</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</section>
